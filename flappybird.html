<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flappy Bird · ArcadeVerse</title>
<style>
  :root{
    --bg:#0d0e1a; --panel:#171a2b; --magenta:#ff3d81; --cyan:#29f4d0;
    --text:#e8e9f3; --muted:#7a7fa0;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family:'Segoe UI',system-ui,sans-serif; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
  }
  @font-face{
    font-family:'ArcadePx';
    src:local('Press Start 2P');
  }
  .frame{
    position:relative; width:min(480px,96vw); aspect-ratio:9/13.5;
    border:3px solid var(--panel); border-radius:14px; overflow:hidden;
    box-shadow:0 0 0 6px #05060c, 0 0 40px rgba(41,244,208,.15);
    background:#0a0c16;
  }
  canvas{display:block; width:100%; height:100%;}
  .topbar{
    position:absolute; top:0; left:0; right:0; padding:10px 14px;
    display:flex; justify-content:space-between; align-items:center;
    font-size:12px; letter-spacing:.05em; color:var(--cyan);
    text-shadow:0 0 8px rgba(41,244,208,.6); z-index:5; pointer-events:none;
  }
  .backbtn{
    pointer-events:auto; background:none; border:1px solid var(--muted);
    color:var(--text); padding:5px 10px; border-radius:6px; cursor:pointer;
    font-size:11px;
  }
  .backbtn:hover{border-color:var(--cyan); color:var(--cyan);}
  .overlay{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:16px; text-align:center;
    background:radial-gradient(circle at 50% 30%, rgba(23,26,43,.85), rgba(10,12,22,.96));
    z-index:10; padding:24px;
  }
  .hidden{display:none;}
  .title{
    font-size:26px; font-weight:800; color:var(--cyan);
    text-shadow:0 0 16px rgba(41,244,208,.6); margin:0;
  }
  .sub{color:var(--muted); font-size:13px; max-width:260px; line-height:1.5; margin:0;}
  .score-final{font-size:44px; font-weight:800; color:var(--magenta); text-shadow:0 0 18px rgba(255,61,129,.6);}
  .btn-primary{
    background:linear-gradient(135deg,var(--magenta),#c62368);
    color:#fff; border:none; padding:12px 26px; border-radius:8px;
    font-size:14px; font-weight:700; cursor:pointer; letter-spacing:.03em;
    box-shadow:0 6px 20px rgba(255,61,129,.35);
  }
  .btn-primary:hover{filter:brightness(1.1);}
  .hint{color:var(--muted); font-size:11px;}
</style>
</head>
<body>
<div class="frame">
  <div class="topbar">
    <button class="backbtn" onclick="goBack()">‹ Back</button>
    <span id="liveScore">0</span>
  </div>
  <canvas id="game" width="480" height="640"></canvas>

  <div class="overlay" id="startScreen">
    <p class="title">Flappy Bird</p>
    <p class="sub">Tap, click, or press Space to flap. Weave through the pipes and rack up your score.</p>
    <button class="btn-primary" id="startBtn">Start Game</button>
    <p class="hint">Space / Click / Tap = Flap</p>
  </div>

  <div class="overlay hidden" id="gameOverScreen">
    <p class="title" style="color:var(--magenta); text-shadow:0 0 16px rgba(255,61,129,.6);">Game Over</p>
    <div class="score-final" id="finalScore">0</div>
    <p class="sub" id="bestScoreLine">Best: 0</p>
    <button class="btn-primary" id="restartBtn">Play Again</button>
  </div>
</div>

<script>
function goBack(){
  try{ if(window.top !== window.self){ window.top.postMessage({type:'arcadeverse:back'}, '*'); return; } }catch(e){}
  window.location.href = 'index.html';
}

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const startScreen = document.getElementById('startScreen');
const gameOverScreen = document.getElementById('gameOverScreen');
const liveScoreEl = document.getElementById('liveScore');
const finalScoreEl = document.getElementById('finalScore');
const bestScoreLine = document.getElementById('bestScoreLine');

const GRAVITY = 0.45;
const FLAP_VELOCITY = -8.2;
const PIPE_GAP = 155;
const PIPE_WIDTH = 62;
const PIPE_SPEED = 2.6;
const PIPE_SPACING = 220;
const GROUND_H = 70;

let bird, pipes, frame, score, state, best;
best = Number(localStorage.getItem('flappy_best') || 0);

function resetGame(){
  bird = { x: 110, y: H/2, vy: 0, r: 15, rot: 0 };
  pipes = [];
  frame = 0;
  score = 0;
  liveScoreEl.textContent = '0';
  spawnPipe(true);
}

function spawnPipe(first){
  const margin = 70;
  const top = margin + Math.random() * (H - GROUND_H - PIPE_GAP - margin*2);
  pipes.push({ x: first ? W + 60 : (pipes.length? pipes[pipes.length-1].x + PIPE_SPACING : W + 60), top, passed:false });
}

function flap(){
  if(state === 'start'){ startGame(); return; }
  if(state !== 'playing') return;
  bird.vy = FLAP_VELOCITY;
}

function startGame(){
  state = 'playing';
  startScreen.classList.add('hidden');
  gameOverScreen.classList.add('hidden');
  resetGame();
  bird.vy = FLAP_VELOCITY;
  requestAnimationFrame(loop);
}

function endGame(){
  state = 'over';
  if(score > best){ best = score; localStorage.setItem('flappy_best', best); }
  finalScoreEl.textContent = score;
  bestScoreLine.textContent = 'Best: ' + best;
  gameOverScreen.classList.remove('hidden');
}

function update(){
  bird.vy += GRAVITY;
  bird.y += bird.vy;
  bird.rot = Math.max(-0.5, Math.min(1.3, bird.vy / 10));

  if(bird.y + bird.r > H - GROUND_H){ bird.y = H - GROUND_H - bird.r; endGame(); }
  if(bird.y - bird.r < 0){ bird.y = bird.r; bird.vy = 0; }

  for(const p of pipes){ p.x -= PIPE_SPEED; }
  if(pipes.length && pipes[0].x < -PIPE_WIDTH){ pipes.shift(); }
  if(pipes.length && pipes[pipes.length-1].x < W - PIPE_SPACING){ spawnPipe(false); }

  for(const p of pipes){
    if(!p.passed && p.x + PIPE_WIDTH < bird.x){
      p.passed = true; score++; liveScoreEl.textContent = score;
    }
    const withinX = bird.x + bird.r > p.x && bird.x - bird.r < p.x + PIPE_WIDTH;
    const hitTop = bird.y - bird.r < p.top;
    const hitBottom = bird.y + bird.r > p.top + PIPE_GAP;
    if(withinX && (hitTop || hitBottom)){ endGame(); }
  }
  frame++;
}

function drawBackground(){
  const grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#0d0e1a'); grad.addColorStop(1,'#161a2e');
  ctx.fillStyle = grad; ctx.fillRect(0,0,W,H);
  ctx.fillStyle = 'rgba(41,244,208,0.05)';
  for(let i=0;i<4;i++){
    const bx = ((frame*0.3)+i*140) % (W+140) - 140;
    ctx.beginPath();
    ctx.moveTo(bx,H-GROUND_H);
    ctx.lineTo(bx+40,H-GROUND_H-90);
    ctx.lineTo(bx+80,H-GROUND_H);
    ctx.fill();
  }
}

function drawPipes(){
  for(const p of pipes){
    ctx.fillStyle = '#1c2138';
    ctx.strokeStyle = '#29f4d0';
    ctx.lineWidth = 2;
    ctx.fillRect(p.x, 0, PIPE_WIDTH, p.top);
    ctx.strokeRect(p.x, 0, PIPE_WIDTH, p.top);
    ctx.fillRect(p.x, p.top+PIPE_GAP, PIPE_WIDTH, H-GROUND_H-(p.top+PIPE_GAP));
    ctx.strokeRect(p.x, p.top+PIPE_GAP, PIPE_WIDTH, H-GROUND_H-(p.top+PIPE_GAP));
  }
}

function drawGround(){
  ctx.fillStyle = '#171a2b';
  ctx.fillRect(0, H-GROUND_H, W, GROUND_H);
  ctx.strokeStyle = '#ff3d81';
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(0,H-GROUND_H); ctx.lineTo(W,H-GROUND_H); ctx.stroke();
  ctx.fillStyle = '#0f1220';
  const off = (frame*PIPE_SPEED)%20;
  for(let x=-off; x<W; x+=20){ ctx.fillRect(x, H-GROUND_H+8, 10,6); }
}

function drawBird(){
  ctx.save();
  ctx.translate(bird.x, bird.y);
  ctx.rotate(bird.rot);
  ctx.fillStyle = '#ffd23f';
  ctx.beginPath(); ctx.arc(0,0,bird.r,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#ff3d81';
  ctx.beginPath(); ctx.moveTo(bird.r-2,-3); ctx.lineTo(bird.r+10,2); ctx.lineTo(bird.r-2,6); ctx.fill();
  ctx.fillStyle = '#0d0e1a';
  ctx.beginPath(); ctx.arc(5,-4,2.6,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

function draw(){
  drawBackground();
  drawPipes();
  drawBird();
  drawGround();
}

function loop(){
  if(state !== 'playing') return;
  update();
  draw();
  requestAnimationFrame(loop);
}

state = 'start';
resetGame();
draw();

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('restartBtn').addEventListener('click', startGame);
window.addEventListener('keydown', (e)=>{ if(e.code === 'Space'){ e.preventDefault(); flap(); } });
canvas.addEventListener('mousedown', flap);
canvas.addEventListener('touchstart', (e)=>{ e.preventDefault(); flap(); }, {passive:false});
</script>
</body>
</html>
